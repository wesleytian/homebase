<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏡</text></svg>">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#faf8f5" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon-512.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Fraunces:opsz,wght@9..144,400;9..144,700&display=swap" rel="stylesheet">
    <title>Homebase</title>
    <meta name="description" content="One place for your goals, habits, to-dos, and reflections." />
    <meta property="og:title" content="Homebase" />
    <meta property="og:description" content="One place for your goals, habits, to-dos, and reflections." />
    <meta property="og:image" content="https://myhomebase.me/og-image.png" />
    <meta property="og:url" content="https://myhomebase.me" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root">
      <style>
        @keyframes init-fade { 0%,100% { opacity: 0.5; } 50% { opacity: 1; } }
        @keyframes init-fill { 0% { width: 0%; } 100% { width: 90%; } }
        #init-loader {
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          min-height: 100vh;
          gap: 24px;
          background: linear-gradient(135deg, #faf8f5 0%, #f5f0eb 100%);
          font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        }
        #init-loader .icon { font-size: 2.8rem; animation: init-fade 2s ease-in-out infinite; line-height: 1; }
        #init-loader .bar-track {
          width: 120px; height: 4px; background: #e8e4df; border-radius: 4px; overflow: hidden;
        }
        #init-loader .bar-fill {
          height: 100%; background: #e8a87c; border-radius: 4px;
          animation: init-fill 2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }
      </style>
      <div id="init-loader">
        <div class="icon">🏡</div>
        <div class="bar-track"><div class="bar-fill"></div></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');</script>
  </body>
</html>
